<style>
/* ===================== Reset & Page Layout ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #f5f3ee;
  --bg-dark:      #f0ede6;
  --white:        #fff;
  --text:         #1c1b18;
  --text-muted:   #8a8575;
  --border:       #e2ddd4;
  --accent:       #c4a35a;
  --accent-dark:  #9a7a3a;
  --accent-light: #ead89a;
  --dark:         #2a2824;
  --radius:       8px;
  --radius-lg:    16px;
  --shadow-lg:    0 8px 32px rgba(28,27,24,0.14);
}

html { height: 100%; }

body {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ===================== Header ===================== */
.site-header {
  width: 100%;
  text-align: center;
  padding: 28px 20px 18px;
}

.site-header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text);
}

.site-header p {
  margin-top: 6px;
  font-size: 0.88rem;
  color: var(--text-muted);
}

/* ===================== Book Container ===================== */
.book-wrap {
  width: 100%;
  max-width: 1100px;
  padding: 0 16px 40px;
  flex: 1;
}

/* ===================== Footer ===================== */
.site-footer {
  width: 100%;
  text-align: center;
  padding: 18px 20px 24px;
  font-size: 0.75rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}

/* ===================== StPageFlip (vendor) ===================== */
.stf__parent {
  position: relative;
  display: block;
  box-sizing: border-box;
  transform: translateZ(0);
  -ms-touch-action: pan-y;
  touch-action: pan-y;
}
.sft__wrapper { position: relative; width: 100%; box-sizing: border-box; }
.stf__parent canvas { position: absolute; width: 100%; height: 100%; left: 0; top: 0; }
.stf__block { position: absolute; width: 100%; height: 100%; box-sizing: border-box; perspective: 2000px; }
.stf__item { display: none; position: absolute; transform-style: preserve-3d; }
.stf__outerShadow, .stf__innerShadow, .stf__hardShadow, .stf__hardInnerShadow { position: absolute; left: 0; top: 0; }

/* ===================== FlipBook Component ===================== */
.fb {
  --fb-gap: 14px;
  position: relative;
  display: block;
  outline: none;
}

.fb-viewport {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
}

.fb--zoomed .fb-viewport { cursor: grab; }
.fb-viewport.is-panning { cursor: grabbing; }

.fb-stage {
  margin: 0 auto;
  position: relative;
  border-radius: var(--radius);
  transform-origin: center center;
  will-change: transform;
}

.fb-book { width: 100%; height: 100%; }

.fb[data-dir="rtl"] .fb-book { transform: scaleX(-1); }
.fb[data-dir="rtl"] .fb-page > * { transform: scaleX(-1); }

.fb--vert .fb-book {
  position: absolute;
  left: 50%;
  top: 50%;
  transform-origin: center center;
}
.fb--vert[data-dir="btt"] .fb-book { transform: translate(-50%, -50%) rotate(90deg); }
.fb--vert[data-dir="ttb"] .fb-book { transform: translate(-50%, -50%) rotate(-90deg); }

.fb--vert .fb-page > * {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--fb-pw);
  height: var(--fb-ph);
  transform-origin: center center;
}
.fb--vert[data-dir="btt"] .fb-page > * { transform: translate(-50%, -50%) rotate(-90deg); }
.fb--vert[data-dir="ttb"] .fb-page > * { transform: translate(-50%, -50%) rotate(90deg); }
.fb--vert .fb-stage { cursor: pointer; }

.fb-page {
  background: var(--white);
  overflow: hidden;
  box-shadow: 0 2px 14px rgba(28,27,24,0.14);
}

.fb-page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  background: var(--white);
}

.fb-img--low { filter: blur(1px); }

.fb-page--html {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.fb-html {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 8%;
  box-sizing: border-box;
  font-size: 0.9rem;
  line-height: 1.75;
  color: var(--text);
  overflow: auto;
}

.fb-hotspot {
  position: absolute;
  display: block;
  border-radius: 4px;
  background: transparent;
  transition: background 0.2s ease, box-shadow 0.2s ease;
}
.fb-hotspot:hover, .fb-hotspot:focus-visible {
  background: rgba(196,163,90,0.18);
  box-shadow: 0 0 0 2px var(--accent);
}

.fb-toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: var(--fb-gap);
  flex-wrap: wrap;
}

.fb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--text);
  font-family: inherit;
  font-size: 0.85rem;
  line-height: 1;
  cursor: pointer;
  transition: all 0.28s ease;
}

.fb-btn span { font-size: 1.2rem; line-height: 1; }

.fb-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-dark);
  transform: translateY(-2px);
}
.fb-btn:disabled { opacity: 0.35; cursor: default; }
.fb-btn--text { text-decoration: none; }

.fb-pager {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.fb-pager__input {
  width: auto;
  min-width: 46px;
  height: 38px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--text);
  font-family: inherit;
  font-size: 0.85rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
  transition: border-color 0.28s ease;
}
.fb-pager__input:focus { outline: none; border-color: var(--accent); }
.fb-pager__total { white-space: nowrap; }

.fb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }

.fb-zoom-label {
  min-width: 48px;
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.fb-zoom-label:hover { color: var(--accent-dark); }

.fb-toc { position: relative; display: inline-flex; }
.fb-toc__panel {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  min-width: 230px;
  max-width: 320px;
  max-height: 320px;
  overflow-y: auto;
  padding: 6px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
}

.fb-toc__item {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 14px;
  width: 100%;
  padding: 8px 10px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--text);
  font-family: inherit;
  font-size: 0.85rem;
  text-align: left;
  line-height: 1.5;
  cursor: pointer;
  transition: background 0.2s ease;
}
.fb-toc__item:hover { background: var(--bg-dark); }

.fb-toc__page {
  flex: none;
  font-size: 0.72rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.fb--fullscreen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: var(--dark);
  padding: 20px;
}
.fb--fullscreen-pseudo { position: fixed; inset: 0; z-index: 9999; }
.fb--fullscreen .fb-viewport { flex: none; }
.fb--fullscreen .fb-toolbar { margin-top: 18px; }
.fb--fullscreen .fb-btn,
.fb--fullscreen .fb-pager__input {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.18);
  color: #fff;
}
.fb--fullscreen .fb-btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent-light);
}
.fb--fullscreen .fb-pager,
.fb--fullscreen .fb-zoom-label { color: rgba(255,255,255,0.65); }
.fb--fullscreen .fb-sep { background: rgba(255,255,255,0.18); }

.fb-status {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 120px;
  padding: 24px;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-align: center;
}
.fb-status--error { color: var(--accent-dark); }

.fb--loading, .fb--failed {
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
}

@media (max-width: 700px) {
  .fb-toolbar { gap: 8px; }
  .fb-counter { min-width: 76px; font-size: 0.78rem; }
  .site-header h1 { font-size: 1.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  .fb-btn { transition: none; }
  .fb-btn:hover:not(:disabled) { transform: none; }
}
</style>

<!-- page-flip engine (vendor) -->
<script src="page-flip.browser.js"></script>

<!-- ===================== FlipBook Viewer (from src/flipbook.js, patched for standalone) ===================== -->
<script>
(function () {
  "use strict";

  var ENGINE = window.St && window.St.PageFlip;

  var RATIO_PORTRAIT = 0.95;
  var MOBILE_WIDTH   = 700;
  var DEFAULT_HEIGHT = 680;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }

  function baseDirOf(url) {
    return url.replace(/[^/]*$/, "");
  }

  var ROMAN = [
    [1000, "m"], [900, "cm"], [500, "d"], [400, "cd"], [100, "c"], [90, "xc"],
    [50, "l"], [40, "xl"], [10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"],
  ];

  function toRoman(n) {
    var out = "";
    for (var i = 0; i < ROMAN.length && n > 0; i++) {
      while (n >= ROMAN[i][0]) { out += ROMAN[i][1]; n -= ROMAN[i][0]; }
    }
    return out;
  }

  var STYLES = ["none", "arabic", "roman-lower", "roman-upper"];

  function normalizeRanges(list) {
    var out = [];
    (list || []).forEach(function (r) {
      var from = parseInt(r.from, 10);
      if (!from || from < 1) return;
      var style = STYLES.indexOf(r.style) >= 0 ? r.style : "arabic";
      out.push({ from: from, style: style, start: Math.max(1, parseInt(r.start, 10) || 1) });
    });
    out.sort(function (a, b) { return a.from - b.from; });
    return out;
  }

  function parseRanges(text) {
    return normalizeRanges(String(text).split(",").map(function (chunk) {
      var bits = chunk.split(":");
      return { from: bits[0], style: (bits[1] || "").trim(), start: bits[2] };
    }));
  }

  function FlipBook(root) {
    this.root     = root;
    this.manifest = null;
    this.baseDir  = "";
    this.engine   = null;
    this.mode     = "single";
    this.pageEls  = [];
    this.current  = 0;
    this.destroyed = false;
    this._onResize = this._onResize.bind(this);
    this._onKey    = this._onKey.bind(this);
  }

  FlipBook.prototype.init = function () {
    var self = this;
    var url = this.root.getAttribute("data-book");

    if (!ENGINE) {
      this.fail("翻頁引擎未載入（page-flip.browser.js）");
      return Promise.resolve();
    }
    if (!url) {
      this.fail("缺少 data-book 屬性");
      return Promise.resolve();
    }

    if (this.root.__flipbook) this.root.__flipbook.destroy();
    this.root.__flipbook = this;
    window.flipbooks = window.flipbooks || [];
    if (window.flipbooks.indexOf(this) < 0) window.flipbooks.push(this);

    this.baseDir  = baseDirOf(url);
    this.fallback = this.root.innerHTML;
    this.root.classList.add("fb", "fb--loading");
    this.root.innerHTML = '<div class="fb-status">載入中…</div>';

    // ★ Standalone patch: if __BOOK_JSON__ is available, use it directly
    //    instead of fetching book.json (avoids CORS issues with file://)
    if (window.__BOOK_JSON__) {
      this.manifest = window.__BOOK_JSON__;
      this.build();
      return Promise.resolve();
    }

    return fetch(url, { cache: "no-cache" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        self.manifest = data;
        self.build();
      })
      .catch(function (e) {
        self.fail("電子書載入失敗：" + e.message);
      });
  };

  FlipBook.prototype.fail = function (msg) {
    this.root.classList.remove("fb--loading");
    this.root.classList.add("fb--failed");
    this.root.innerHTML =
      '<div class="fb-status fb-status--error">' + msg + "</div>" + (this.fallback || "");
  };

  FlipBook.prototype.build = function () {
    var m = this.manifest;
    var dir = this.root.getAttribute("data-direction") || m.direction || "ltr";
    if (["ltr", "rtl", "btt", "ttb"].indexOf(dir) < 0) dir = "ltr";
    this.direction = dir;
    this.vertical = dir === "btt" || dir === "ttb";

    var cover = this.root.getAttribute("data-show-cover");
    this.showCover = cover != null ? cover !== "false" : m.showCover !== false;

    var num = m.numbering || {};
    var mode = this.root.getAttribute("data-numbering") || num.mode || "sheet";

    if (mode === "book") {
      mode = "labels";
      if (!num.ranges) {
        var one = Math.max(1, parseInt(num.bookPageOne, 10) || 1);
        num = { ranges: one > 1
          ? [{ from: 1, style: "none" }, { from: one, style: "arabic", start: 1 }]
          : [{ from: 1, style: "arabic", start: 1 }] };
      }
    }

    if (["sheet", "labels", "none"].indexOf(mode) < 0) mode = "sheet";
    this.numbering = mode;

    var attrRanges = this.root.getAttribute("data-ranges");
    this.ranges = attrRanges ? parseRanges(attrRanges) : normalizeRanges(num.ranges);

    this.root.classList.remove("fb--loading");
    this.root.innerHTML = "";
    this.root.setAttribute("tabindex", "0");
    this.root.setAttribute("role", "region");
    this.root.setAttribute("aria-label", (m.title || "電子書") + " 翻頁閱讀器");

    this.viewport = el("div", "fb-viewport");
    this.stage = el("div", "fb-stage");
    this.book  = el("div", "fb-book");
    this.stage.appendChild(this.book);
    this.viewport.appendChild(this.stage);
    this.root.appendChild(this.viewport);

    this.zoom = 1;
    this.pan = { x: 0, y: 0 };
    this.bindZoomPan();

    this.buildPages();
    this.buildLabels();

    if (this.root.getAttribute("data-hash") !== "on") return;
    var h = "#page=" + (this.current + 1);
    if (location.hash !== h) history.replaceState(null, "", h);
  };

  FlipBook.prototype._onResize = function () {
    var self = this;
    clearTimeout(this._rt);
    this._rt = setTimeout(function () {
      if (self.destroyed) return;
      var before = self.mode;
      self.layout();
      if (before !== self.mode) self.goto(self.current + 1);
    }, 150);
  };

  FlipBook.prototype._onKey = function (e) {
    var active = this.root.contains(document.activeElement) || this.root.matches(":hover");
    if (!active) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    var nextKeys, prevKeys;
    switch (this.direction) {
      case "rtl": nextKeys = ["ArrowLeft", "ArrowDown", "PageDown"];  prevKeys = ["ArrowRight", "ArrowUp", "PageUp"];   break;
      case "btt": nextKeys = ["ArrowUp", "PageUp"];                   prevKeys = ["ArrowDown", "PageDown"];             break;
      case "ttb": nextKeys = ["ArrowDown", "PageDown"];               prevKeys = ["ArrowUp", "PageUp"];                 break;
      default:    nextKeys = ["ArrowRight", "ArrowDown", "PageDown"]; prevKeys = ["ArrowLeft", "ArrowUp", "PageUp"];
    }

    if (nextKeys.indexOf(e.key) >= 0) this.next();
    else if (prevKeys.indexOf(e.key) >= 0) this.prev();
    else if (e.key === "Home") this.goto(1);
    else if (e.key === "End")  this.goto(this.pageEls.length);
    else return;

    e.preventDefault();
  };

  FlipBook.prototype.destroy = function () {
    this.destroyed = true;
    window.removeEventListener("resize", this._onResize);
    document.removeEventListener("keydown", this._onKey);
    if (this._panMove) window.removeEventListener("pointermove", this._panMove);
    if (this._panUp) window.removeEventListener("pointerup", this._panUp);
    if (this._fsWatch) document.removeEventListener("fullscreenchange", this._fsWatch);
    if (this._escExit) document.removeEventListener("keydown", this._escExit);
    clearTimeout(this._fsRelayout);
    if (this.pseudoFullscreen) document.body.style.overflow = this._prevOverflow || "";
    clearTimeout(this._rt);
    this.destroyEngine();

    if (this.root.__flipbook === this) delete this.root.__flipbook;
    var list = window.flipbooks || [];
    var i = list.indexOf(this);
    if (i >= 0) list.splice(i, 1);
  };

  // ── Auto-boot ──
  function boot() {
    var nodes = document.querySelectorAll("[data-book]");
    for (var i = 0; i < nodes.length; i++) new FlipBook(nodes[i]).init();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  window.FlipBook = FlipBook;
})();
</script>

</body>
</html>
